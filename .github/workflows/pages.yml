name: Pages

# Builds the site in the repository's Nix dev shell and, on main, deploys dist/ to GitHub Pages
# (custom domain oss.zeabur.com, set in the repository's Pages settings). Pull requests only build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time on main, never cancelled halfway; a newer push to a pull request replaces
# the older build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Shellcheck
        run: nix develop --command shellcheck scripts/*.sh
      - name: Build
        env:
          # The docs sync reads each locked repository's tarball from GitHub.
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command sh -c 'bun install --frozen-lockfile && bun run build'
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
