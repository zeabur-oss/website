name: Pages

# Builds the site in the repository's Nix dev shell and, on main, deploys dist/ to GitHub Pages
# (custom domain oss.zeabur.com, set in the repository's Pages settings). Pull requests only build.
# The schedule picks up each repository's newest release every 6 hours.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time on main, never cancelled halfway; a newer push to a pull request replaces
# the older build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: instabox-small
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - name: Shellcheck
        run: nix develop --command shellcheck scripts/*.sh
      - name: Lint
        run: nix develop --command sh -c 'bun install --frozen-lockfile && bun run lint && bun scripts/docs-check.ts . --name overview'
      - name: Build
        env:
          # The docs sync reads each repository's releases and tarballs from GitHub.
          GITHUB_TOKEN: ${{ github.token }}
          # PostHog's project key (repository variable POSTHOG_KEY), only in builds that deploy;
          # without it the site sends nothing.
          PUBLIC_POSTHOG_KEY: ${{ github.event_name != 'pull_request' && vars.POSTHOG_KEY || '' }}
        run: nix develop --command sh -c 'bun install --frozen-lockfile && bun run build'
      - name: Test
        run: nix develop --command bun test scripts/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: instabox-small
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
