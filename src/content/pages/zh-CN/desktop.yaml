status: released
lines:
  nav: 用 Zeabur 管理现有的集群
  landing: 你熟悉的 Zeabur，直接打开在现有的 Kubernetes 集群上，集群不用先改。
meta:
  title: Zeabur Desktop：用 Zeabur 管理现有的集群
  description: Zeabur Desktop 用你电脑上的 kubeconfig 打开 Zeabur，操作和你熟悉的 Zeabur 一样。集群不用先安装任何东西，现有的应用也不用重新部署。可以在 macOS、Windows 和 Linux 使用。
titleDim: 你熟悉的 Zeabur，
title: 直接用在现有的集群上
sub: Zeabur Desktop 用你电脑上的 kubeconfig 连上集群，窗口里就是同一套 Zeabur。集群不用先安装任何东西，你应用变更之前，集群也不会有任何改动。
