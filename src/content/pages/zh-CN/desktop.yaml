highlights:
  titleDim: 集群原来的样子，
  title: 都会保留
  items:
    - tag: zeabur-local
      title: 集群里不用安装 Zeabur
      body: Zeabur 在你的电脑上运行，和 zeaburctl ui 用的是同一个本地服务。它不会在集群安装组件，也不用准备域名和登录服务。
    - tag: Namespace
      title: 现有的应用照常运行
      body: 把已有的 Namespace 添加为项目时，Zeabur 只加上项目标签，里面的服务、数据和安全设置都保持原样。不想用了，去掉标签就行。
    - tag: RBAC
      title: 用你自己的权限
      body: 读取、检查变更和应用，都用那个 context 的权限，集群的 RBAC 照常生效。团队只开放了部分权限，Zeabur Desktop 就只能做那些。
how:
  titleDim: 不用改集群，
  title: 打开就能上手
  steps:
    - title: 选一个集群
      body: Zeabur Desktop 列出 kubeconfig 里的每个 context。Zeatend 装的个人服务器、云厂商的 Kubernetes、团队给你的 kubeconfig 都能用。
    - title: 就是你熟悉的 Zeabur
      body: 新窗口打开的是同一套 Zeabur 界面。有管理权限的话，集群里已经在运行的应用可以直接添加为项目，不用重新部署。
    - title: 哪里要处理，一眼就能看到
      body: 首页列出整个集群里需要处理的服务，用直白的话说明原因和接下来能做什么，比如内存不够时直接调整。
details:
  title: 各版本怎么安装和更新
  cols:
    - 电脑
    - 文件
    - 新版本
  rows:
    - - Apple 芯片的 Mac
      - .dmg，打开后把 Zeabur 拖进“应用程序”
      - 自动更新
    - - x64 的 Windows
      - -setup.exe，只为你的账号安装，不需要管理员权限
      - 自动更新
    - - x64 的 Windows，免安装
      - -portable.exe
      - 提示新版本，到发布页面下载
    - - Debian 或 Ubuntu
      - .deb，amd64 或 arm64
      - 提示新版本，到发布页面下载
    - - Fedora、RHEL 或 openSUSE
      - .rpm，amd64 或 arm64
      - 提示新版本，到发布页面下载
    - - 其他 Linux
      - .AppImage，amd64 或 arm64
      - 自动更新
start:
  title: 下载 Zeabur Desktop
  sub: 按钮会选好适合你电脑的版本，其他版本都列在下面。目前没有适用于 Intel Mac 和 Arm 架构 Windows 的版本。
  cta: 下载 Zeabur Desktop
