status: released
lines:
  nav: 在自己的集群上部署和管理服务的 Web 界面
  landing: 把集群整理成项目和服务，说明哪里出错、该怎么处理。
meta:
  title: Zeabur 开源版：在自己的主机上，用熟悉的方式部署服务
  description: Zeabur 开源版是开源软件。项目、服务、域名、环境变量和应用模板，都和你用过的部署平台一样。主机找哪家租、选哪个套餐，由你决定。
titleDim: 在自己的主机上，
title: 点几下就部署好
sub: 从 Git、Docker Compose 或应用模板部署，绑定域名、修改环境变量，都是你在其他部署平台上熟悉的用法。服务运行在你自己的主机上，费用按你选的云服务或机房计算。
docs: 阅读 Zeabur 开源版文档
source: GitHub 上的源代码
highlights:
  titleDim: 用过其他部署平台？
  title: 大部分都一样
  items:
    - tag: deploy
      title: 部署方式一样
      body: 从 Git、Docker Compose、Docker 镜像或应用模板部署，也能直接上传文件夹。
    - tag: domains
      title: 域名、变量和日志
      body: 给服务绑定域名，在服务页修改环境变量、查看日志。新版本有问题时，回滚到上一个版本。
    - tag: server
      title: 主机是你的，由你维护
      body: 费用按你选的主机计算。升级 Zeabur 开源版、备份数据和维护主机，由你或你的团队负责。
how:
  titleDim: 你改配置之前，
  title: 先让你看过
  steps:
    - title: 整理成项目
      body: Zeabur 开源版直接读取集群，把服务的程序、数据库、域名和存储放在一起。它没有自己的数据库要备份，每次读写都用你自己的权限。
    - title: 用大白话说明问题
      body: 需要处理的服务排在最前面，告诉你原因、该怎么做，旁边就是日志。
    - title: 确认后才应用
      body: 改配置前，先列出会创建、修改或删除哪些东西，你确认后才写入。有人刚改过同一个服务，就要重新检查。
details:
  title: 能做什么，需要准备什么
  cols:
    - 功能
    - 范围
    - 集群里需要
  rows:
    - - 从 Git 部署
      - 推送后自动构建并部署
      - Zeabur Builder
    - - 镜像与 Compose
      - 部署容器镜像，导入 Docker Compose 服务
      - 不用另外安装
    - - 数据库
      - 创建、备份与恢复
      - 对应的数据库 Operator，例如 CloudNativePG
    - - 对象存储
      - 创建 S3 对象存储与存储桶
      - SeaweedFS Operator
    - - 公开域名
      - 添加域名与 HTTPS，显示维护和错误页面
      - Ingress Controller 或 Gateway，以及 cert-manager
    - - 管理集群
      - 成员权限、节点、告警通知、集群备份、组件
      - 管理员权限
start:
  title: 从手头的环境开始
  sub: 三种安装方式打开的是同一套界面，区别在于 Zeabur 开源版运行在哪里、用谁的凭据。
  cta: 在一台服务器上安装
