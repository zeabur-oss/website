status: released
lines:
  nav: Zeabur OSS on the clusters you already have
  landing: The Zeabur you know, opened on the Kubernetes cluster you already have, with nothing to change in it first.
meta:
  title: "Zeabur Desktop: Zeabur OSS on the clusters you already have"
  description: Zeabur Desktop opens Zeabur OSS with the kubeconfig on your computer, and it works like the Zeabur you know. There's nothing to install in the cluster and no app to redeploy. It runs on macOS, Windows, and Linux.
titleDim: The Zeabur you know,
title: on the cluster you already have.
sub: Zeabur Desktop connects to your cluster with the kubeconfig on your computer, and the window holds the same Zeabur OSS. There's nothing to install in the cluster, and nothing in it changes until you apply a change.
